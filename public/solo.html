<style>
/* Layout: candy-village board on the left, a solid control column on the right; stacks on phones. */
:root {
  --bg: #fbeef4;
  --panel: #ffffff;
  --panel-2: #fdf5f9;
  --ink: #2b1630;
  --muted: #76577b;
  --line: #ecd3e1;
  --accent: #d92f74;
  --accent-ink: #ffffff;
  --mint: #23a58a;
  --gold: #c98a12;
  --lilac: #7f5fd1;
  --sky: #2f8fd6;
  --danger: #c7372f;
  --ok: #23875f;
  --shadow: 0 2px 0 rgba(80, 20, 60, .08), 0 8px 24px rgba(80, 20, 60, .08);
  --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1220; --panel: #281c30; --panel-2: #21172a; --ink: #f8eaf3; --muted: #bba2c0;
    --line: #3d2c47; --accent: #ff5f9e; --accent-ink: #1b1220; --mint: #4fd1b2; --gold: #f2bd4b;
    --lilac: #ad93f5; --sky: #6bb8f2; --danger: #ff7a70; --ok: #5ad69b;
    --shadow: 0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1220; --panel: #281c30; --panel-2: #21172a; --ink: #f8eaf3; --muted: #bba2c0;
  --line: #3d2c47; --accent: #ff5f9e; --accent-ink: #1b1220; --mint: #4fd1b2; --gold: #f2bd4b;
  --lilac: #ad93f5; --sky: #6bb8f2; --danger: #ff7a70; --ok: #5ad69b;
  --shadow: 0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
button { font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
a { color: var(--accent); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); gap: 16px; max-width: 1400px; margin: 0 auto; align-items: start; }
@media (max-width: 980px) { .app { grid-template-columns: minmax(0, 1fr); } }

/* board */
.board-wrap { position: relative; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); background: var(--panel); }
.board-wrap svg { display: block; width: 100%; height: auto; max-height: calc(100vh - 32px); aspect-ratio: 1; margin: 0 auto; }
.statusbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.statusbar .btn { margin-left: auto; padding: 6px 12px; font-size: 13px; }
.sign { background: var(--panel); color: var(--ink); border-radius: 10px; padding: 6px 12px; box-shadow: var(--shadow); font-weight: 800; font-size: 13px; transform: rotate(-2deg); }
.sign:nth-child(2) { transform: rotate(1.5deg); }
.sign b { font-family: var(--display); font-weight: 400; font-size: 16px; color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 14px; font-size: 12px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--line); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 2px solid rgba(0,0,0,.15); }
@media (max-width: 640px) {
  .legend { display: none; }  /* the board has its own key; save space on phones */
  .board-wrap { border-radius: 12px; }
  .card { padding: 12px; }
  .phase-head h2 { font-size: 20px; }
  .modal { padding: 16px; }
}

/* side column */
.side { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.phase-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.phase-head h2 { font-size: 22px; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 800; background: var(--panel-2); border: 1px solid var(--line); }
.chip.trend { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 800; background: var(--panel-2); color: var(--ink); border: 2px solid var(--line); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.btn.primary:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.choice { text-align: left; border-radius: 12px; padding: 10px 12px; background: var(--panel-2); border: 2px solid var(--line); color: var(--ink); }
.choice:hover { border-color: var(--accent); }
.choice b { display: block; font-size: 15px; }
.choice small { color: var(--muted); font-size: 12px; display: block; line-height: 1.35; margin-top: 2px; }
.prompt { font-size: 16px; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.timer { height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--line); }
.timer > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: width .1s linear; }
.story { border-left: 4px solid var(--gold); background: var(--panel-2); padding: 10px 12px; border-radius: 0 12px 12px 0; }
.story ul { margin: 6px 0 0; padding-left: 18px; }
.story li { margin: 3px 0; }
.real { border-left-color: var(--mint); }
.lesson { font-size: 13px; color: var(--muted); }

/* stats */
.me { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--panel-2); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.stat .label { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat .value { font-family: var(--mono); font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 4px; }
.bar > div { height: 100%; background: var(--sky); }
.risk-hi { color: var(--danger); }
@media (max-width: 420px) { .me { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* leaderboard */
.lb { width: 100%; border-collapse: collapse; font-size: 13px; }
.lb th { text-align: right; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 800; padding: 4px 4px; }
.lb th:first-child, .lb td:first-child { text-align: left; }
.lb td { padding: 5px 4px; border-top: 1px solid var(--line); text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lb td:first-child { font-family: var(--body); font-weight: 700; white-space: normal; }
.lb tr.you td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.dot { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: middle; }
.dot.brand { border-radius: 3px; } .dot.infl { border-radius: 50%; }
.tag { font-size: 10px; font-weight: 800; color: var(--muted); margin-left: 4px; }
.lb-wrap { overflow-x: auto; }

/* feed */
.feed { max-height: 220px; overflow-y: auto; display: grid; gap: 6px; font-size: 13px; }
.feed div { padding: 6px 8px; background: var(--panel-2); border-radius: 8px; }
.feed .r { color: var(--muted); font-family: var(--mono); font-size: 11px; margin-right: 6px; }

/* overlays */
.overlay { position: fixed; inset: 0; background: rgba(30, 10, 30, .55); display: grid; place-items: center; z-index: 50; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal { background: var(--panel); color: var(--ink); border-radius: 20px; padding: 22px; width: min(640px, 100%); max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow); }
.modal h2 { font-size: 26px; margin-bottom: 8px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.field input, .field select { font: inherit; padding: 9px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel-2); color: var(--ink); }
.picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.pick { border: 2px solid var(--line); border-radius: 14px; padding: 10px; background: var(--panel-2); text-align: left; color: var(--ink); }
.pick[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel-2)); }
.pick small { display: block; color: var(--muted); font-size: 12px; }
.offer { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--panel-2); border: 2px solid var(--line); }
.offer[aria-pressed="true"] { border-color: var(--mint); }
.chart { width: 100%; height: auto; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--mono); }
.win { color: var(--ok); font-weight: 800; }
/* pieces: raised tokens with a ground shadow, a bobbing lift and a pulsing rim */
.piece .lift { animation: bob 2.6s ease-in-out infinite; animation-delay: var(--d, 0s); }
.piece .rim { stroke: #ffffff; stroke-width: .6; animation: rim 1.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
.piece.me .rim { stroke-width: .9; animation: rim-me 1s ease-in-out infinite; }
.piece.me .halo { transform-box: fill-box; transform-origin: center; animation: ping 1.6s ease-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-0.7px); } }
@keyframes rim { 0%, 100% { stroke: #ffffff; } 50% { stroke: #1f0d24; } }
@keyframes rim-me { 0%, 100% { stroke: #ffd23f; } 50% { stroke: #ffffff; } }
@keyframes ping { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.5); opacity: 0; } }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.howto section { background: var(--panel-2); border-radius: 14px; padding: 12px; }
.howto h3 { font-size: 17px; margin-bottom: 4px; }
.howto ul { margin: 0; padding-left: 18px; font-size: 14px; }
.howto li { margin: 4px 0; }
.modal.wide { width: min(860px, 100%); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <div class="board-wrap" id="boardWrap">
    <svg id="board" viewBox="0 0 100 100" role="img" aria-label="Candy village game board"></svg>
    <div class="legend" id="legend"></div>
  </div>
  <div class="side">
    <div class="statusbar"><span class="sign">Round <b id="roundSign">1</b> of <span id="roundsTotal">6</span></span><span class="sign">Trend: <b id="trendSign">—</b></span><button class="btn" id="rulesBtn" type="button">How to play</button></div>
    <section class="card stack" id="phaseCard" aria-live="polite"></section>
    <section class="card stack">
      <div class="phase-head"><h3 id="meName">Your team</h3><span class="chip" id="meRole"></span></div>
      <div class="me" id="meStats"></div>
      <div class="small muted" id="meContracts"></div>
    </section>
    <section class="card stack">
      <div class="phase-head"><h3>Leaderboards</h3><span class="small muted">ranked within each role</span></div>
      <div class="lb-wrap" id="lbBrand"></div>
      <div class="lb-wrap" id="lbInfl"></div>
    </section>
    <section class="card stack">
      <h3>Feed</h3>
      <div class="feed" id="feed"></div>
    </section>
  </div>
</div>
<div id="overlayRoot"></div>

<script>
"use strict";
/* ============================================================ config (from sim/RESULTS.md) */
const CFG = {
  rounds: 6, maxRounds: 8,
  prize: 1000000,
  backlashSlide: 3,
  buy: { brand: 12000, infl: 4000 },
  paydayMult: 100,
  fee: 8000,
  // movement from choices; arrays are [High, Mid, Low] trust
  stepTarget: { "Delete": [0, 0, 0], "Apologize": [1, 1, 1], "Ignore": [1, 1, 0], "Lean in": [3, 1, -1] },
  stepSupport: 1, stepCritique: 2, stepJoin: 1, speedBonus: [2, 1],
  reactionSeconds: 30,
};
const PROFILES = {
  Heritage:   { role: "brand", money: 40000, att: 10, trust: 8, gain: 3, blurb: "Old, trusted name. Slow attention." },
  Challenger: { role: "brand", money: 40000, att: 20, trust: 7, gain: 6, blurb: "Upstart brand. More buzz, a bit less trust." },
  Niche:      { role: "infl",  money: 5000,  att: 15, trust: 8, gain: 6, blurb: "Small, loyal audience." },
  Mass:       { role: "infl",  money: 5000,  att: 25, trust: 6, gain: 8, blurb: "Huge reach, shakier trust." },
};
const TAGS = ["Humor", "Food", "Fitness", "Value"];
const FLOP = { // attention, trust [High, Mid, Low], risk
  "Delete":    { att: 7,  trust: [-1, -1, -1], risk: 0 },
  "Apologize": { att: 10, trust: [0, 0, 0],    risk: -1 },
  "Ignore":    { att: 15, trust: [0, 0, -1],   risk: 0 },
  "Lean in":   { att: 25, trust: [1, 0, -2],   risk: 1 },
};
const band = t => t >= 7 ? 0 : (t >= 4 ? 1 : 2);
const BAND_NAME = ["High", "Mid", "Low"];

/* ============================================================ event cards (event-cards.md) */
const CARDS = {
  "Tiny Bite": {
    kind: "flop", role: "brand", story: "McDonald's CEO and the Big Arch (Mar 2026)",
    target: "Your CEO's taste-test video just went viral for the wrong reasons. He called the burger a “product” and took a tiny bite. Rivals are posting their own big bites.",
    others: n => `${n}'s CEO taste-test video is getting roasted online.`,
    learn: ["Hundreds of users filmed themselves copying the tiny bite, and reviews of the Big Arch were already lukewarm.",
      "Burger King's president posted a hearty Whopper bite (“Thought we'd replay this”). Wendy's posted its U.S. president eating a Baconator. A&W Canada made a parody.",
      "McDonald's went in with decades of trust. Leaning in at High trust gains trust and costs every critic 1 trust."],
    real: "McDonald's leaned in and mocked its own video on X. Burger King, Wendy's and A&W Canada critiqued it with joke videos.",
    realMove: "Lean in",
    lesson: "Storytelling beats promotion: the scripted “product” pitch read as an ad, and joking about the flop told a better story.",
    source: ["The Takeout, Mar 5, 2026", "https://www.thetakeout.com/2116456/rival-fast-food-ceos-respond-mcdonald-big-arch-viral-video"],
  },
  "Logo Redesign": {
    kind: "flop", role: "brand", story: "Gap's new logo (Oct 2010)", deleteNoAttention: true,
    target: "You swapped your classic logo for a new one with no warning. Fans hate it, and someone made a fake account mocking it.",
    others: n => `${n}'s new logo is getting mocked everywhere.`,
    learn: ["Gap launched the logo without asking anyone, then asked fans on Facebook to design a replacement. Designers saw that as a request for free work.",
      "It arrived alongside a disappointing sales report and a $247M stock drop.",
      "On this card, Delete gives no attention at all."],
    real: "Gap apologized and brought back the old logo within about a week. The public critiqued it with a mocking fake Twitter account and a “Craplogo” generator. Brand president Marka Hansen: “We recognize that we missed the opportunity to engage with the online community.”",
    realMove: "Apologize",
    lesson: "Conversation over billboards: Gap announced the change instead of starting a conversation.",
    source: ["TechCrunch, Oct 11, 2010", "https://techcrunch.com/2010/10/11/gap-logo-redesign"],
  },
  "Launch Ad: Crush": {
    kind: "flop", role: "brand", title: "Launch Ad Backlash", story: "Apple's “Crush!” iPad ad (May 2024)",
    target: "Your new ad shows a hydraulic press crushing guitars and paint into your tablet. Creative people are furious.",
    others: n => `${n}'s launch ad is being called anti-creative.`,
    learn: ["Tim Cook's post got about 19,000 replies, most of them angry.",
      "Hugh Grant called it “the destruction of the human experience.” Paul Graham said “Steve wouldn't have shipped that ad.”",
      "Samsung had just taken back the #1 smartphone spot."],
    real: "Apple apologized: “We missed the mark with this video, and we're sorry.” Samsung critiqued with its “UnCrush” ad: “Creativity cannot be crushed.”",
    realMove: "Apologize",
    lesson: "Context is queen: crushing creative tools was the wrong image for an audience of creators.",
    source: ["TechCentral, May 16, 2024", "https://techcentral.co.za/creativity-crushed-samsung-ad-mocks-apple/244717/"],
  },
  "Launch Ad: AI Holiday": {
    kind: "flop", role: "brand", title: "Launch Ad Backlash", story: "Coca-Cola's AI holiday ad (Nov 2024)",
    target: "You remade your classic holiday ad with AI. People are calling it “soulless,” and artists are angry.",
    others: n => `${n}'s AI-made holiday ad is getting slammed by artists.`,
    learn: ["The video had more than 56 million views. Three AI studios made it using four AI models.",
      "A marketing professor said the problem was the holiday setting: people link Christmas with human connection.",
      "A business professor noted AI ads are much cheaper and predicted companies will keep making them."],
    real: "Coca-Cola defended the ad as “a collaboration of human storytellers and the power of generative AI,” which is closest to Ignore. Gravity Falls creator Alex Hirsch critiqued with a joke: “@CocaCola is ‘red’ because it's made from the blood of out-of-work artists!”",
    realMove: "Ignore",
    lesson: "Context is queen: a season built on human connection clashed with an AI-made ad.",
    source: ["NBC News, Nov 18, 2024", "https://www.nbcboston.com/news/national-international/coca-cola-causes-controversy-with-ai-made-ad/3554978/"],
  },
  "Missing Disclosure": {
    kind: "flop", role: "infl", story: "Lord & Taylor's paid dress posts (2015)", sharesTrust: true,
    target: "Your sponsored post about a dress didn't say it was paid. Followers are noticing, and so is the government.",
    others: n => `${n} got caught posting a paid ad without saying so.`,
    learn: ["Lord & Taylor gave 50 influencers the dress plus $1,000–$4,000 each. None of the posts said they were paid.",
      "The posts reached 11.4 million Instagram users in two days and the dress sold out.",
      "The FTC charged the brand, so on this card your contracted brand takes the same trust change you do."],
    real: "Under an FTC settlement, Lord & Taylor must disclose paid endorsements and monitor its influencer campaigns, which is closest to Apologize.",
    realMove: "Apologize",
    lesson: "Trust depends on being honest about who's selling. Hidden promotion wins attention while putting trust at risk.",
    source: ["FTC, Mar 15, 2016", "https://www.ftc.gov/news-events/news/press-releases/2016/03/lord-taylor-settles-ftc-charges-it-deceived-consumers-through-paid-article-online-fashion-magazine"],
  },
  "Copy-Paste Caption": {
    kind: "flop", role: "infl", story: "Scott Disick's Bootea post (May 2016)",
    target: "You posted a sponsored photo, and the brand's instructions went up with it: “Here you go, at 4pm est, write the below.” Screenshots are spreading.",
    others: n => `${n} just posted a brand's script word for word.`,
    learn: ["The pasted text showed the posting time and the exact caption the brand had written.",
      "Bootea had also worked with Lindsay Lohan, Vanessa Hudgens and Ashley Tisdale, so the slip exposed how scripted endorsements can be.",
      "Deleting removes the post but not the screenshots."],
    real: "The caption came down and was replaced, which is closest to Delete. Refinery29 called it “an embarrassingly transparent look” at how celebrity endorsements are produced.",
    realMove: "Delete",
    lesson: "A scripted caption is promotion pretending to be a person. When the script shows, trust goes.",
    source: ["Refinery29, May 19, 2016", "https://www.refinery29.com/2016/05/111399/scott-disick-bootea-instagram"],
  },
  "Meme Format": {
    kind: "open", story: "IHOP becomes “IHOb” (Jun 2018)",
    prompt: "IHOP says it's now the International House of Burgers, and brands are renaming themselves “Pancake ___” as a joke. Join the meme?",
    learn: ["IHOP had 10 straight quarters of falling sales. The “name change” was a stunt to launch burgers.",
      "A consultant estimated it earned “several hundred million dollars of free publicity.”",
      "Every joke is also a free ad for the brand that started it. Eater called it “the most obnoxious brand move of the year.”"],
    real: "Burger King renamed itself “Pancake King,” and Wendy's, White Castle, Whataburger and Red Robin all posted jokes. IHOP switched back about a month later.",
    lesson: "Huge reach isn't the same as lasting value.",
    source: ["NBC Washington, Jun 2018", "https://www.nbcwashington.com/news/national-international/whatapancake-pancake-castle-rival-restaurants-industry-analysts-react-to-ihop-name-change/2055790/"],
  },
  "Algorithm Shift": {
    kind: "open", story: "Snapchat's redesign and Kylie Jenner's tweet (Feb 2018)",
    prompt: "The platform just changed how feeds work. Brands under contract lose 5 attention unless their influencer matches the trend.",
    learn: ["Snapchat moved friends and celebrities into separate sections, and more than 1.2 million users petitioned against it.",
      "CEO Evan Spiegel said of celebrities: “They're not your friend.”",
      "Kylie Jenner tweeted “sooo does anyone else not open Snapchat anymore?” Snap lost about $1.3B in market value the next day."],
    real: "The platform changed under creators and brands, and one influencer's casual post had more effect than the company's statement.",
    lesson: "Context is queen: when the platform changes, what works on it changes too.",
    source: ["The Guardian, Feb 23, 2018", "https://www.theguardian.com/technology/2018/feb/22/snapchat-redesign-12m-signature-petition-social-media-app-kylie-jenner-celebrities"],
  },
  "Trend Spike": {
    kind: "open", story: "Sherwin-Williams and TikToker Tony Piloseno (2020–2022)",
    prompt: "A niche trend is blowing up. Influencers matching this round's trend gain +10 attention.",

const PATH_CACHE = {};
function buildPath(c1, c2) {
  const k = `${c1 || "quiet"}|${c2 || "quiet"}`;
  if (!PATH_CACHE[k]) PATH_CACHE[k] = [START, ...seg("trunk1"), ...seg(c1 === "viral" ? "f1v" : "f1q"), ...seg("trunk2"), ...seg(c2 === "viral" ? "f2v" : "f2q"), ...seg("trunk3")];
  return PATH_CACHE[k];
}
const FORK1 = 8;

const SPACE_COLOR = { Deal: "var(--mint)", Feed: "#f6e9f1", Event: "var(--accent)", Talent: "var(--lilac)", Payday: "var(--gold)", Fork: "#ffffff", Finish: "var(--gold)", Start: "#ffffff" };

// a solid sign so road names read from across the room
function boardSign(x, y, text, size, fill, ink, rot = 0) {
  const w = text.length * size * 0.66 + size * 1.4, hgt = size * 1.6;

    `<text x="${x}" y="${y + size * 0.36}" text-anchor="middle" font-size="${size}" font-family="Bagel Fat One, system-ui" fill="${ink}" letter-spacing=".05">${text}</text></g>`;
}

/* ============================================================ state */
const rng = Math.random;
const pick = a => a[Math.floor(rng() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const money = n => (n < 0 ? "−$" : "$") + Math.abs(Math.round(n)).toLocaleString("en-US");
const roll = () => 1 + Math.floor(rng() * 6);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const BOT_NAMES = { brand: ["Gumdrop Co.", "Fizzwhistle", "Crunchmallow", "Taffy & Sons"], infl: ["@sprinklesam", "@taffytalks", "@chewchoo", "@lollilena"] };

function newTeam(id, name, profile, strat, isPlayer) {

function newGame(opts) {
  const teams = [];
  const role = PROFILES[opts.profile].role;
  teams.push(newTeam(0, opts.name || "You", opts.profile, null, true));
  if (role === "infl") teams[0].tag = opts.tag;
  const strats = shuffle(["Bold", "Cautious", "Smart", "Random", "Smart"]);
  const nb = role === "brand" ? 2 : 3, ni = role === "infl" ? 2 : 3;
  const bn = shuffle([...BOT_NAMES.brand]), inn = shuffle([...BOT_NAMES.infl]);
  for (let i = 0; i < nb; i++) teams.push(newTeam(teams.length, bn[i], pick(["Heritage", "Challenger"]), strats.pop(), false));
  for (let i = 0; i < ni; i++) teams.push(newTeam(teams.length, inn[i], pick(["Niche", "Mass"]), strats.pop(), false));
  G = { teams, round: 0, rounds: CFG.rounds, trend: null, finishOrder: [], stamp: 0, timed: opts.timed, log: [], over: false, eventsSeen: [] };
  G.me = teams[0];
}

const path = t => buildPath(t.c1, t.c2);
const progress = t => t.pos / (path(t).length - 1);
const spaceOf = t => path(t)[t.pos];
const others = t => G.teams.filter(o => o !== t);

/* ============================================================ engine */
function chooseFork(t) {
  if (t.isPlayer) return t.pref1 && !t.c1 ? t.pref1 : (t.c1 ? (t.pref2 || "quiet") : "quiet");
  const s = STRATS[t.strat].fork;
  if (s === "random") return pick(["quiet", "viral"]);
  if (s === "adaptive") return t.risk <= 1 ? "viral" : "quiet";
  return s;
}

function advance(t, n, trail) {
  for (let i = 0; i < n; i++) {
    if (t.finished) return;
    const nxt = t.pos + 1;
    if (!t.c1 && nxt > FORK1) {
      t.c1 = t.isPlayer ? (t.pref1 || "quiet") : chooseFork(t);
      if (t.c1 === "viral") { t.risk += 1; say(`${t.name} took the viral road at the first fork (+1 risk).`); }
    }
    if (t.c1 && !t.c2 && nxt > fork2Index(t.c1)) {
      t.c2 = t.isPlayer ? (t.pref2 || "quiet") : chooseFork(t);
      if (t.c2 === "viral") { t.risk += 1; say(`${t.name} took the viral road at the second fork (+1 risk).`); }
    }
    t.pos = nxt;
    trail.push(t.pos);
    const sp = spaceOf(t);
    if ((sp.type === "Payday" || sp.type === "Finish") && !t.paid.has(sp.key)) {
      t.paid.add(sp.key);
      const pay = t.att * t.trust * CFG.paydayMult;
      t.money += pay;
      say(`${t.name} hit a payday: ${t.att} attention × ${t.trust} trust = ${money(pay)}.`);
    }
    if (sp.type === "Finish") {
      t.finished = { round: G.round, stamp: G.stamp, left: n - i - 1 };
      G.finishOrder.push(t);
      say(`🏁 ${t.name} reached the finish!`);
      return;
    }
  }
}
function retreat(t, n, trail) {
  if (t.finished) return;
  for (let i = 0; i < n && t.pos > 0; i++) { t.pos -= 1; trail.push(t.pos); }
}
function move(t, n) {
  const trail = [];
  if (n >= 0) advance(t, n, trail); else retreat(t, -n, trail);
  return trail;
}

function say(text) { G.log.unshift({ r: G.round, text }); }

/* ---- bot decisions, each returns [choice, reason] */
function botTargetResponse(t, card) {
  const s = STRATS[t.strat].target;
  if (s === "random") return [pick(Object.keys(FLOP)), "random pick"];

    return [r, `its trust is ${BAND_NAME[band(t.trust)]}`];
  }
  const r = { lean: "Lean in", apologize: "Apologize" }[s];
  return [r, STRATS[t.strat].why];
}
function botReaction(t, target) {
  const s = STRATS[t.strat].react;
  if (s === "random") return [pick(["Support", "Critique", "Out"]), "random pick"];
  if (s === "adaptive") {
    if (band(target.trust) === 0) return ["Support", `${target.isPlayer ? "your team has" : target.name + " has"} High trust and may lean in`];
    const safe = t.risk <= 0 || t.money >= CFG.buy[t.role] * 2;
    return safe ? ["Critique", "it can afford the extra risk"] : ["Support", "it can't afford more risk"];
  }
  return [{ critique: "Critique", support: "Support" }[s], STRATS[t.strat].why];
}
function botJoinsMeme(t) {

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function smoothPath(pts) {
  if (pts.length < 2) return "";
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(2)},${c1[1].toFixed(2)} ${c2[0].toFixed(2)},${c2[1].toFixed(2)} ${p2[0]},${p2[1]}`;
  }
  return d;
}

  }
  const tiles = [START, ...["trunk1", "f1q", "f1v", "trunk2", "f2q", "f2v", "trunk3"].flatMap(seg)];
  for (const s of tiles) {

    const fill = SPACE_COLOR[s.type];

    const g = SPACE_GLYPH[s.type];
    if (g) h += `<text x="${s.x}" y="${s.y + (s.type === "Finish" ? 0.9 : 0.8)}" text-anchor="middle" font-size="${s.type === "Finish" ? 2.6 : (g.length > 1 ? 1.6 : 2.4)}" font-family="Bagel Fat One, system-ui" fill="${s.type === "Feed" || s.type === "Fork" || s.type === "Start" ? "#5b2f55" : "#ffffff"}">${g}</text>`;
    h += `</g>`;
  }
  // road signs: fork 1 big, fork 2 smaller
  h += boardSign(77, 4.6, "QUIET ROAD", 3.2, "#bfeee2", "#0f4d40", -3);
  h += boardSign(51, 37, "VIRAL ROAD", 3.2, "#e3367a", "#ffffff", 4);
  h += boardSign(4.2, 74, "QUIET", 2.3, "#bfeee2", "#0f4d40", -90);
  h += boardSign(35, 70.5, "VIRAL", 2.3, "#e3367a", "#ffffff", 6);
  // on-board key
  const kx = 1.5, ky = 9, rowH = 2.9;
  h += `<g><rect x="${kx}" y="${ky}" width="19" height="${4 + KEY_ROWS.length * rowH}" rx="1.6" fill="rgba(255,255,255,.94)" stroke="#1f0d24" stroke-width=".3"/>`;
  h += `<text x="${kx + 1.4}" y="${ky + 2.9}" font-size="2" font-family="Bagel Fat One, system-ui" fill="#1f0d24">KEY</text>`;
  KEY_ROWS.forEach(([type, label], i) => {

    .map(([t, l]) => `<span><i style="background:${SPACE_COLOR[t]}"></i>${l}</span>`).join("") +

    `<span><i style="background:#ffd23f;border-color:#ffffff"></i>Tall piece with a gold flashing rim = you</span>`;

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v * f));
  return `rgb(${c.join(",")})`;
}
function drawPieces() {
  const g = $("pieces");
  if (!g) return;
  const groups = {};
  for (const t of G.teams) {
    const sp = path(t)[t.displayPos];
    (groups[sp.key] = groups[sp.key] || []).push([t, sp]);
  }
  // draw back-to-front so nearer (lower) pieces overlap farther ones
  const items = [];
  for (const list of Object.values(groups)) {
    list.forEach(([t, sp], i) => {
      const n = list.length, ang = (i / n) * Math.PI * 2 - Math.PI / 2, off = n > 1 ? 2.4 : 0;
      const x = sp.x + Math.cos(ang) * off, y = sp.y + Math.sin(ang) * off;
      // height: you stand tallest; pieces sharing a space get staggered heights so none hides another
      const h = (t.isPlayer ? 4.2 : 2.4) + (n > 1 && !t.isPlayer ? (i % 3) * 0.9 : 0);
      items.push({ t, x, y, h });
    });
  }
  items.sort((a, b) => a.y - b.y || (a.t.isPlayer ? 1 : -1));
  let html = "";
  for (const { t, x, y, h } of items) {
    const top = y - h, side = shade(t.color, 0.62), dark = shade(t.color, 0.45);
    const d = (t.id * 0.37).toFixed(2);
    const face = (dy, fill, cls) => t.role === "brand"
      ? `<rect class="${cls}" x="${x - 2}" y="${top - 2 + dy}" width="4" height="4" rx="1" fill="${fill}"/>`
      : `<circle class="${cls}" cx="${x}" cy="${top + dy}" r="2.1" fill="${fill}"/>`;
    html += `<g class="piece ${t.isPlayer ? "me" : ""}" style="--d:-${d}s"><title>${esc(t.isPlayer ? t.name + " (you)" : t.name)}</title>
      <ellipse cx="${x + 0.5}" cy="${y + 0.6}" rx="${t.isPlayer ? 2.8 : 2.4}" ry="1" fill="rgba(25,0,25,.5)" filter="url(#soft)"/>
      ${t.isPlayer ? `<circle class="halo" cx="${x}" cy="${y}" r="3" fill="none" stroke="#ffd23f" stroke-width=".6"/>` : ""}
      <g class="lift">
        <rect x="${x - 0.6}" y="${top}" width="1.2" height="${h}" rx=".5" fill="${dark}"/>
        ${face(0.8, side, "")}
        ${face(0, t.color, "rim")}
        <ellipse cx="${x - 0.7}" cy="${top - 0.9}" rx=".9" ry=".45" fill="rgba(255,255,255,.55)"/>
        <text x="${x}" y="${top + 0.8}" text-anchor="middle" font-size="2" font-family="Nunito Sans, system-ui" font-weight="800" fill="#ffffff">${esc(initial(t))}</text>
        ${t.isPlayer ? `<g transform="translate(${x} ${top - 3.6})"><rect x="-2.6" y="-1.3" width="5.2" height="2.3" rx="1.1" fill="#ffd23f" stroke="#1f0d24" stroke-width=".25"/><text y=".5" text-anchor="middle" font-size="1.5" font-family="Nunito Sans, system-ui" font-weight="800" fill="#1f0d24">YOU</text></g>` : ""}
      </g></g>`;
  }
  g.innerHTML = html;
}
const initial = t => t.isPlayer ? "★" : t.name.replace(/^@/, "")[0].toUpperCase();

async function animate(moves) {
  // moves: [[team, trail]], all pieces hop together
  const longest = Math.max(0, ...moves.map(m => m[1].length));
  for (let i = 0; i < longest; i++) {
    for (const [t, trail] of moves) if (i < trail.length) t.displayPos = trail[i];
    drawPieces();
    await sleep(matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 150);
  }
  for (const [t] of moves) t.displayPos = t.pos;
  drawPieces();
}

  for (const role of ["brand", "infl"]) {
    const rows = G.teams.filter(t => t.role === role).sort((a, b) => (b.money - b.start) - (a.money - a.start));
    $(role === "brand" ? "lbBrand" : "lbInfl").innerHTML = `<table class="lb"><thead><tr><th>${role === "brand" ? "Brands" : "Influencers"}</th><th>Net $</th><th>Att</th><th>Trust</th><th>Risk</th><th>Space</th></tr></thead><tbody>${rows.map(t => `
      <tr class="${t.isPlayer ? "you" : ""}"><td><span class="dot ${t.role}" style="background:${t.color}"></span>${esc(t.name)}<span class="tag">${t.isPlayer ? "YOU" : t.strat.toUpperCase()}</span></td>
      <td>${money(t.money - t.start)}</td><td>${t.att}</td><td>${t.trust}</td><td>${t.risk}</td><td>${t.finished ? "🏁" : t.pos}</td></tr>`).join("")}</tbody></table>`;
  }
  $("feed").innerHTML = G.log.slice(0, 60).map(l => `<div><span class="r">R${l.r}</span>${esc(l.text)}</div>`).join("");
}

function setPhase(html) { $("phaseCard").innerHTML = html; }
function waitClick(selector) {
  return new Promise(resolve => {
    const card = $("phaseCard");
    const handler = e => {
      const b = e.target.closest(selector);
      if (!b || b.disabled || !card.contains(b)) return;
      card.removeEventListener("click", handler);
      resolve(b);
    };
    card.addEventListener("click", handler);
  });
}

function storyHtml(card, showReal) {
  const c = CARDS[card];
  return `<div class="story"><div class="eyebrow">True story · ${esc(c.story)}</div><ul>${c.learn.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
    <div class="small"><a href="${c.source[1]}" target="_blank" rel="noopener">${esc(c.source[0])}</a></div></div>` +
    (showReal ? `<div class="story real"><div class="eyebrow">What really happened</div><div>${esc(c.real)}</div><div class="lesson">${esc(c.lesson)}</div></div>` : "");
}

/* ============================================================ phases */
async function rollPhase() {
  setPhase(`<div class="phase-head"><h2>Roll and move</h2><span class="eyebrow">Round ${G.round}</span></div>
    <p class="muted small">Everyone rolls at once. If your risk is higher than your roll, you get a backlash: −1 trust, −10 attention, and you slide back ${CFG.backlashSlide} spaces.</p>
    <div class="row"><button class="btn primary" data-go>Roll the dice</button></div>`);
  await waitClick("[data-go]");
  G.stamp++;
  const moves = [];
  const lines = [];
  for (const t of G.teams) {
    if (t.finished) continue;
    const r = roll(); t.lastRoll = r;
    const trail = move(t, r);
    let note = `${t.isPlayer ? "You" : t.name} rolled ${r}`;
    if (!t.finished && t.risk > r) {
      t.trust = Math.max(1, t.trust - 1); t.att = Math.max(0, t.att - 10); t.risk = Math.max(0, t.risk - 2); t.backlashes++;
      trail.push(...move(t, -CFG.backlashSlide));
      note += ` and got a BACKLASH (risk was higher than the roll): −1 trust, −10 attention, slid back ${CFG.backlashSlide}`;
    }
    say(note + ".");
    lines.push(note);
    moves.push([t, trail]);
  }
  renderStatus();
  await animate(moves);
  const me = G.me;
  setPhase(`<div class="phase-head"><h2>Roll and move</h2><span class="eyebrow">Round ${G.round}</span></div>
    <p class="prompt">${esc(lines.find(l => l.startsWith("You")) || "You're already at the finish.")}.</p>
    <p class="muted small">You're on a ${esc(spaceOf(me).type)} space.</p>
    <div class="row"><button class="btn primary" data-go>Reveal the trend</button></div>`);
  renderStatus();
  await waitClick("[data-go]");
  G.trend = pick(TAGS);
  say(`Trending this round: ${G.trend}.`);
  renderStatus();
}

function inRange(brand, infl) {
  return spaceOf(brand).type === "Deal" || Math.abs(brand.pos - infl.pos) <= 4;
}

async function dealPhase() {
  const me = G.me;
  const price = CFG.buy[me.role];
  let buy = 0;
  let offerTo = null, offerAmt = CFG.fee;
  const needFork1 = !me.c1 && me.pos >= FORK1 - 9;
  const needFork2 = me.c1 && !me.c2 && me.pos >= fork2Index(me.c1) - 9;
  const draw = () => {
    const maxBuy = Math.max(0, Math.min(me.risk, Math.floor((me.money - (offerTo ? offerAmt : 0)) / price)));
    buy = Math.min(buy, maxBuy);
    let offerHtml = "";
    if (me.role === "brand") {
      const infl = G.teams.filter(t => t.role === "infl");
      const full = me.contracts.length >= 2;
      offerHtml = `<div class="field"><label>Offer a two-round contract</label>
        ${full ? `<div class="small muted">You already hold two contracts.</div>` : `<div class="picker">${infl.map(t => {
          const ok = inRange(me, t) && t.contracts.length < 2;
          return `<button class="pick" data-infl="${t.id}" aria-pressed="${offerTo === t.id}" ${ok ? "" : "disabled"}><b>${esc(t.name)}</b>
            <small>${t.profile} · ${t.tag}${t.tag === G.trend ? " (trending!)" : ""} · att ${t.att} · trust ${t.trust}</small>
            <small>${ok ? (spaceOf(me).type === "Deal" ? "On a deal space: any influencer" : "Within 4 spaces") : (t.contracts.length >= 2 ? "Fully booked" : "Too far away")}</small></button>`;
        }).join("")}</div>
        <div class="row"><span class="small">Fee</span><input id="fee" type="range" min="1000" max="${Math.max(1000, Math.min(20000, me.money))}" step="1000" value="${offerAmt}" ${offerTo === null ? "disabled" : ""}><span class="num" id="feeLabel">${money(offerAmt)}</span>
        ${offerTo !== null ? `<button class="btn" data-clear>Cancel offer</button>` : ""}</div>
        <div class="small muted">Bot influencers usually take the highest offer. The usual rate is ${money(CFG.fee)}. Signing someone with trust 3 or lower adds 1 risk.</div>`}</div>`;
    } else {
      offerHtml = `<div class="small muted">Brands send their offers when you finish this step. You'll see them side by side.</div>`;
    }
    const forkField = (n, cur) => `<div class="field"><label>Fork ${n} ahead: which road?</label><div class="picker">
      <button class="pick" data-fork="${n}:quiet" aria-pressed="${cur !== "viral"}"><b>Quiet road</b><small>Longer and calmer.</small></button>
      <button class="pick" data-fork="${n}:viral" aria-pressed="${cur === "viral"}"><b>Viral road</b><small>Shorter, more events, +1 risk.</small></button></div></div>`;
    setPhase(`<div class="phase-head"><h2>Deal window</h2><span class="chip trend">${G.trend} is trending</span></div>
      <div class="field"><label>Buy down risk (${money(price)} per point)</label>
        <div class="row"><button class="btn" data-buy="-1" ${buy <= 0 ? "disabled" : ""}>−</button><span class="num">${buy}</span>
        <button class="btn" data-buy="1" ${buy >= maxBuy ? "disabled" : ""}>+</button>
        <span class="small muted">Risk ${me.risk} → ${me.risk - buy} · cost ${money(buy * price)}</span></div></div>
      ${needFork1 ? forkField(1, me.pref1) : ""}${needFork2 ? forkField(2, me.pref2) : ""}
      ${offerHtml}
      <div class="row"><button class="btn primary" data-done>Done with deals</button></div>`);
  };
  draw();
  const card = $("phaseCard");
  await new Promise(resolve => {
    const onClick = e => {
      const b = e.target.closest("button"); if (!b || b.disabled) return;
      if (b.dataset.buy) { buy += +b.dataset.buy; draw(); }
      else if (b.dataset.fork) { const [n, v] = b.dataset.fork.split(":"); me[n === "1" ? "pref1" : "pref2"] = v; draw(); }
      else if (b.dataset.infl) { offerTo = +b.dataset.infl; draw(); }
      else if (b.hasAttribute("data-clear")) { offerTo = null; draw(); }
      else if (b.hasAttribute("data-done")) { card.removeEventListener("click", onClick); card.removeEventListener("input", onInput); resolve(); }
    };
    const onInput = e => { if (e.target.id === "fee") { offerAmt = +e.target.value; $("feeLabel").textContent = money(offerAmt); } };
    card.addEventListener("click", onClick);
    card.addEventListener("input", onInput);
  });
  if (buy > 0) { me.money -= buy * price; me.risk -= buy; say(`You bought down ${buy} risk for ${money(buy * price)}.`); }

  // bots buy down risk
  for (const t of G.teams.filter(t => !t.isPlayer)) {
    const s = STRATS[t.strat];
    if (t.risk >= s.buyAt) {
      const p = CFG.buy[t.role];
      const reserve = t.role === "brand" ? CFG.fee : 0;
      const n = Math.min(t.risk - 1, Math.max(0, Math.floor((t.money - reserve) / p)));
      if (n > 0) { t.money -= n * p; t.risk -= n; say(`${t.name} bought down ${n} risk (${s.why}).`); }
    }
  }

  // offers: { brand, infl, amt }
  const offers = [];
  if (me.role === "brand" && offerTo !== null && me.money >= offerAmt) offers.push({ brand: me, infl: G.teams[offerTo], amt: offerAmt });
  for (const b of G.teams.filter(t => t.role === "brand" && !t.isPlayer && t.contracts.length < 1)) {
    const s = STRATS[b.strat];
    let amt = s.offer || (rng() < 0.5 ? 6000 + 1000 * Math.floor(rng() * 5) : 0);
    if (!amt || b.money < amt) continue;
    const pool = G.teams.filter(i => i.role === "infl" && i.contracts.length < 2 && inRange(b, i) && (b.strat !== "Cautious" || i.trust >= 5));
    if (!pool.length) continue;
    const target = b.strat === "Random" ? pick(pool) : pool.sort((x, y) => (y.tag === G.trend) - (x.tag === G.trend) || y.att - x.att)[0];
    offers.push({ brand: b, infl: target, amt });
  }

  // final call: brands competing for the same influencer may raise once
  const byInfl = new Map();
  for (const o of offers) { if (!byInfl.has(o.infl)) byInfl.set(o.infl, []); byInfl.get(o.infl).push(o); }
  for (const [infl, list] of byInfl) {
    if (list.length < 2) continue;
    for (const o of list) {
      if (o.brand.isPlayer) {
        setPhase(`<div class="phase-head"><h2>Final call</h2><span class="eyebrow">Multiple offers</span></div>
          <p class="prompt">${esc(infl.name)} is considering multiple offers.</p>
          <p class="small muted">You don't know who else offered or how much. You can raise once.</p>
          <div class="row"><input id="raise" type="range" min="${o.amt}" max="${Math.max(o.amt, Math.min(30000, me.money))}" step="1000" value="${o.amt}"><span class="num" id="raiseLabel">${money(o.amt)}</span></div>
          <div class="row"><button class="btn primary" data-go>Send final offer</button></div>`);
        $("raise").addEventListener("input", e => { $("raiseLabel").textContent = money(+e.target.value); });
        await waitClick("[data-go]");
        o.amt = +$("raise").value;
      } else if (o.brand.strat === "Bold" || o.brand.strat === "Smart") {
        const up = o.brand.strat === "Bold" ? 4000 : 2000;
        if (o.brand.money >= o.amt + up) { o.amt += up; say(`${o.brand.name} raised its offer in the final call.`); }
      }
    }
  }

  // influencers choose
  let signed = [];
  for (const [infl, list] of byInfl) {
    list.sort((a, b) => b.amt - a.amt || rng() - 0.5);
    let chosen;
    if (infl.isPlayer) {
      const sel = new Set();
      const drawOffers = () => setPhase(`<div class="phase-head"><h2>Your offers</h2><span class="eyebrow">Pick up to two</span></div>
        <div class="stack">${list.map((o, i) => `<button class="offer" data-o="${i}" aria-pressed="${sel.has(i)}"><span><b>${esc(o.brand.name)}</b>
        <span class="small muted">${o.brand.profile} · att ${o.brand.att} · trust ${o.brand.trust}</span></span><span class="num">${money(o.amt)}</span></button>`).join("")}</div>
        <p class="small muted">A contract pays the fee now and gives you +3 attention per round for two rounds. Holding two contracts costs 1 trust per round.</p>
        <div class="row"><button class="btn primary" data-go>Confirm</button></div>`);
      drawOffers();
      await new Promise(resolve => {
        const card = $("phaseCard");
        const h = e => {
          const b = e.target.closest("button"); if (!b) return;
          if (b.dataset.o) { const i = +b.dataset.o; sel.has(i) ? sel.delete(i) : (sel.size < 2 - infl.contracts.length && sel.add(i)); drawOffers(); }
          else if (b.hasAttribute("data-go")) { card.removeEventListener("click", h); resolve(); }
        };
        card.addEventListener("click", h);
      });
      chosen = [...sel].map(i => list[i]);
    } else {
      const room = 2 - infl.contracts.length;
      chosen = list.slice(0, infl.strat === "Bold" ? room : Math.min(1, room));
    }
    for (const o of list) {
      if (chosen.includes(o) && o.brand.money >= o.amt) {
        const b = o.brand;
        b.money -= o.amt; infl.money += o.amt;
        if (infl.trust <= 3) b.risk += 1;
        if (b.past.has(infl.id)) { b.trust = Math.min(10, b.trust + 1); infl.trust = Math.min(10, infl.trust + 1); }
        b.past.add(infl.id); infl.past.add(b.id);
        b.contracts.push({ partner: infl, left: 2 }); infl.contracts.push({ partner: b, left: 2 });
        signed.push(`${b.name} signed ${infl.name} for ${money(o.amt)}`);
      } else if (o.brand.isPlayer) {
        say(`${infl.name} passed on your offer.`);
      }
    }
  }
  signed.forEach(s => say(s + "."));
  if (me.role === "infl" && !byInfl.has(me)) say("No brands made you an offer this round.");
  renderStatus();
  drawPieces();
}

async function reactionWindow({ title, prompt, card, choices, botActors, onBotDelay }) {
  // returns { choice, time }; bots are scheduled by botActors: [{team, choice, delay}]
  const total = CFG.reactionSeconds;
  const t0 = performance.now();
  let chosen = null, chosenAt = null, done = false, showStory = false;
  const fired = new Set();
  const draw = () => {
    setPhase(`<div class="phase-head"><h2>${esc(title)}</h2><span class="eyebrow">${G.timed ? "Reaction window" : "Untimed"}</span></div>
      <p class="prompt">${esc(prompt)}</p>
      ${G.timed ? `<div class="timer" aria-hidden="true"><div id="timerBar" style="width:100%"></div></div><div class="small muted" id="timerText"></div>` : ""}
      <div class="choices">${choices.map(c => `<button class="choice" data-c="${esc(c.id)}"><b>${esc(c.label)}</b><small>${esc(c.hint)}</small></button>`).join("")}</div>
      <div class="row"><button class="btn" data-learn aria-expanded="${showStory}">${showStory ? "Hide the true story" : "Learn more: the true story"}</button><span class="small muted">The clock keeps running while you read.</span></div>
      <div id="storySlot">${showStory ? storyHtml(card, false) : ""}</div>
      <div class="small muted" id="botTicker"></div>`);
  };
  draw();
  const ticker = () => {
    const el = $("botTicker"); if (!el) return;
    el.innerHTML = botActors.filter(b => fired.has(b)).map(b => `⚡ ${esc(b.team.name)} chose ${esc(b.choice)} at ${b.delay.toFixed(1)}s`).join("<br>");
  };
  return new Promise(resolve => {
    const card = $("phaseCard");
    const finish = () => {
      if (done) return; done = true;
      clearInterval(iv); card.removeEventListener("click", h);
      resolve({ choice: chosen, time: chosenAt });
    };
    const h = e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.hasAttribute("data-learn")) { showStory = !showStory; draw(); ticker(); return; }
      if (b.dataset.c) { chosen = b.dataset.c; chosenAt = (performance.now() - t0) / 1000; finish(); }
    };
    card.addEventListener("click", h);
    const iv = setInterval(() => {
      const el = (performance.now() - t0) / 1000;
      for (const b of botActors) if (!fired.has(b) && b.delay <= el) { fired.add(b); ticker(); }
      if (G.timed) {
        const left = Math.max(0, total - el);
        const bar = $("timerBar"); if (bar) bar.style.width = (left / total * 100) + "%";
        const tt = $("timerText"); if (tt) tt.textContent = `${left.toFixed(0)}s left`;
        if (left <= 0) { chosenAt = total; finish(); }
      }
    }, 100);
  });
}

async function eventPhase(rolls) {
  const me = G.me;
  const onEvent = G.teams.filter(t => !t.finished && spaceOf(t).type === "Event");
  let target = null, cardKey, minors = [];
  if (G.round === 1) {
    const brands = G.teams.filter(t => t.role === "brand");
    target = pick(brands.length ? brands : G.teams);
    cardKey = brands.length ? "Tiny Bite" : "Missing Disclosure";
    minors = onEvent.filter(t => t !== target);
  } else if (onEvent.length) {
    target = onEvent.slice().sort((a, b) => a.lastRoll - b.lastRoll || rng() - 0.5)[0];
    cardKey = target.role === "brand" ? pick(BRAND_FLOPS) : pick(INFL_FLOPS);
    if (cardKey === "Launch Ad") cardKey = pick(["Launch Ad: Crush", "Launch Ad: AI Holiday"]);
    minors = onEvent.filter(t => t !== target);
  } else {
    cardKey = pick(OPEN_EVENTS);
  }
  for (const t of minors) { t.att += 5; t.risk += 1; say(`${t.name} landed on an event space: minor buzz (+5 attention, +1 risk).`); }
  const card = CARDS[cardKey];
  G.eventsSeen.push(cardKey);
  const cardTitle = card.title || cardKey;

  if (card.kind === "flop") await flopEvent(target, cardKey, cardTitle);
  else await openEvent(cardKey);
}

async function flopEvent(target, cardKey, cardTitle) {
  const me = G.me, card = CARDS[cardKey];
  const reactors = G.teams.filter(t => t !== target && !t.finished);
  const botActors = reactors.filter(t => !t.isPlayer).map(t => {
    const [choice, why] = botReaction(t, target);
    return { team: t, choice, why, delay: botSpeed(t) };
  });
  let response, why = "";
  let playerReact = null, playerTime = null;
  G.stamp++;
  const bandIn = band(target.trust), trustIn = target.trust;
  const respHint = r => {
    const f = FLOP[r];
    let step = CFG.stepTarget[r][bandIn];
    let att = r === "Delete" && card.deleteNoAttention ? 0 : f.att;
    const dt = f.trust[bandIn];
    return `+${att} att · ${dt > 0 ? "+" : ""}${dt} trust · ${f.risk > 0 ? "+" : ""}${f.risk} risk · ${step >= 0 ? "+" + step : step} spaces`;
  };
  if (target.isPlayer) {
    const res = await reactionWindow({
      title: `${cardTitle}: it's you`, prompt: card.target, card: cardKey,
      choices: Object.keys(FLOP).map(r => ({ id: r, label: r, hint: respHint(r) })),
      botActors,
    });
    response = res.choice || "Ignore";
    if (!res.choice) say("Time ran out, so your response counts as Ignore.");
  } else if (me.finished) {
    [response, why] = botTargetResponse(target, cardKey);
  } else {
    [response, why] = botTargetResponse(target, cardKey);
    const res = await reactionWindow({
      title: cardTitle, prompt: card.others(target.name) + ` What do you do?`, card: cardKey,
      choices: [
        { id: "Support", label: "Support", hint: `+5 att · +${CFG.stepSupport} space` },
        { id: "Critique", label: "Critique", hint: `+10 att · +2 risk · +${CFG.stepCritique} spaces · −1 trust if they lean in at High trust` },
        { id: "Out", label: "Stay out", hint: "No change" },
      ],
      botActors,
    });
    playerReact = res.choice || "Out";
    playerTime = res.time;
  }

  // target effects
  const f = FLOP[response];
  const dAtt = response === "Delete" && card.deleteNoAttention ? 0 : f.att;
  const dTrust = f.trust[bandIn];
  target.att += dAtt;
  target.trust = clamp(target.trust + dTrust, 1, 10);
  target.risk = Math.max(0, target.risk + f.risk);
  if (card.sharesTrust) for (const c of target.contracts) { c.partner.trust = clamp(c.partner.trust + dTrust, 1, 10); if (dTrust) say(`${c.partner.name} shares the trust change as the contracted brand (${dTrust > 0 ? "+" : ""}${dTrust}).`); }
  const step = CFG.stepTarget[response][bandIn];
  target.flops.push({ round: G.round, card: cardTitle, trustIn, response, dAtt, dTrust, step });
  say(`${target.isPlayer ? "You" : target.name} chose ${response}${why ? ` (${why})` : ""}: +${dAtt} attention, ${dTrust >= 0 ? "+" : ""}${dTrust} trust, ${step >= 0 ? "+" : ""}${step} spaces.`);
  const moves = [[target, move(target, step)]];

  // reactions, ordered by speed
  const acts = botActors.filter(b => b.choice !== "Out").map(b => ({ team: b.team, choice: b.choice, t: b.delay, why: b.why }));
  if (playerReact && playerReact !== "Out") acts.push({ team: me, choice: playerReact, t: playerTime ?? CFG.reactionSeconds, why: "" });
  for (const b of botActors.filter(b => b.choice === "Out")) say(`${b.team.name} stayed out (${b.why}).`);
  acts.sort((a, b) => a.t - b.t);
  acts.forEach((a, i) => {
    const bonus = CFG.speedBonus[i] || 0;
    const t = a.team;
    let steps;
    if (a.choice === "Support") { t.att += 5; steps = CFG.stepSupport; }
    else {
      t.att += 10; t.risk += 2; steps = CFG.stepCritique;
      if (response === "Lean in" && bandIn === 0) { t.trust = Math.max(1, t.trust - 1); }
    }
    t.fromOthers.att += a.choice === "Support" ? 5 : 10;
    t.fromOthers.spaces += steps + bonus;
    moves.push([t, move(t, steps + bonus)]);
    say(`${t.isPlayer ? "You" : t.name} ${a.choice === "Support" ? "supported" : "critiqued"} ${i < 2 ? `(${i === 0 ? "first" : "second"} to react, +${bonus} bonus) ` : ""}at ${a.t.toFixed(1)}s${a.why ? ` — ${a.why}` : ""}.` +
      (a.choice === "Critique" && response === "Lean in" && bandIn === 0 ? ` ${target.isPlayer ? "You" : target.name} leaned in at High trust, so the critique cost 1 trust.` : ""));
  });
  renderStatus();
  await animate(moves);
  await revealPanel(cardKey, cardTitle, `${target.isPlayer ? "You" : esc(target.name)} chose <b>${esc(response)}</b> at ${BAND_NAME[bandIn]} trust.`);
}

async function openEvent(cardKey) {
  const me = G.me, card = CARDS[cardKey];
  const moves = [];
  G.stamp++;
  if (cardKey === "Meme Format") {
    const botActors = G.teams.filter(t => !t.isPlayer && !t.finished).map(t => {
      const j = botJoinsMeme(t);
      return { team: t, choice: j ? "Join" : "Stay out", delay: botSpeed(t), why: STRATS[t.strat].why };
    });
    let mine = null, mineT = null;
    if (!me.finished) {
      const res = await reactionWindow({ title: cardKey, prompt: card.prompt, card: cardKey, botActors,
        choices: [{ id: "Join", label: "Join the meme", hint: `+8 att · +1 risk · +${CFG.stepJoin} space · speed bonus` }, { id: "Out", label: "Stay out", hint: "No change" }] });
      mine = res.choice; mineT = res.time;
    }
    const acts = botActors.filter(b => b.choice === "Join").map(b => ({ team: b.team, t: b.delay }));
    if (mine === "Join") acts.push({ team: me, t: mineT });
    acts.sort((a, b) => a.t - b.t);
    acts.forEach((a, i) => {
      const bonus = CFG.speedBonus[i] || 0;
      a.team.att += 8; a.team.risk += 1;
      a.team.fromOthers.att += 8; a.team.fromOthers.spaces += CFG.stepJoin + bonus;
      moves.push([a.team, move(a.team, CFG.stepJoin + bonus)]);
      say(`${a.team.isPlayer ? "You" : a.team.name} joined the meme${i < 2 ? ` (+${bonus} speed bonus)` : ""}.`);
    });
  } else {
    setPhase(`<div class="phase-head"><h2>${esc(cardKey)}</h2><span class="eyebrow">Open event</span></div>
      <p class="prompt">${esc(card.prompt)}</p>${storyHtml(cardKey, false)}
      <div class="row"><button class="btn primary" data-go>Apply it</button></div>`);
    await waitClick("[data-go]");
    if (cardKey === "Algorithm Shift") {
      for (const t of G.teams) if (t.role === "brand" && t.contracts.length && !t.contracts.some(c => c.partner.tag === G.trend)) { t.att = Math.max(0, t.att - 5); say(`${t.name} lost 5 attention to the algorithm shift.`); }
    } else {
      for (const t of G.teams) if (t.role === "infl" && t.tag === G.trend) { t.att += 10; say(`${t.name} rides the ${G.trend} trend spike (+10 attention).`); }
    }
  }
  renderStatus();
  await animate(moves);
  await revealPanel(cardKey, cardKey, "");
}

async function revealPanel(cardKey, title, line) {
  setPhase(`<div class="phase-head"><h2>${esc(title)}</h2><span class="eyebrow">Resolved</span></div>
    ${line ? `<p class="prompt">${line}</p>` : ""}
    ${storyHtml(cardKey, true)}
    <div class="row"><button class="btn primary" data-go>End the round</button></div>`);
  await waitClick("[data-go]");
}

function resolvePhase() {
  for (const t of G.teams) {
    t.att += t.gain;
    for (const c of t.contracts) {
      if (t.role === "brand") t.att += c.partner.tag === G.trend ? c.partner.att : Math.floor(c.partner.att / 2);
      else t.att += 3;
    }
    if (t.role === "infl" && t.contracts.length >= 2) { t.trust = Math.max(1, t.trust - 1); say(`${t.name} holds two contracts (−1 trust).`); }
  }
  for (const t of G.teams) {
    t.contracts.forEach(c => c.left--);
    t.contracts = t.contracts.filter(c => c.left > 0);
    t.att = clamp(t.att, 0, 100);
    t.att -= Math.floor(t.att / 4);
    t.history.push({ round: G.round, att: t.att, trust: t.trust, money: t.money - t.start });
  }
  say("Attention faded by a quarter. Leaderboards updated.");
  renderStatus();
}

/* ============================================================ game loop */
async function playGame() {
  drawBoard(); drawPieces(); renderStatus();
  while (G.round < G.rounds) {
    G.round++;
    G.trend = null;
    renderStatus();
    await rollPhase();
    await dealPhase();
    await eventPhase();
    resolvePhase();
    if (G.round === CFG.rounds && G.rounds === CFG.rounds) {
      setPhase(`<div class="phase-head"><h2>Round ${G.round} done</h2></div>
        <p class="prompt">${G.finishOrder.length ? `${esc(G.finishOrder[0].name)} already reached the finish.` : "No one has reached the finish yet."}</p>
        <p class="small muted">In class, the teacher can extend the game to ${CFG.maxRounds} rounds here.</p>
        <div class="row"><button class="btn primary" data-end>Finish the game</button><button class="btn" data-extend>Extend to ${CFG.maxRounds} rounds</button></div>`);
      const b = await waitClick("[data-end],[data-extend]");
      if (b.hasAttribute("data-extend")) G.rounds = CFG.maxRounds;
    }
  }
  endGame();
}

function endGame() {
  G.over = true;
  let winner = G.finishOrder.slice().sort((a, b) => a.finished.stamp - b.finished.stamp || b.finished.left - a.finished.left)[0];
  let how = "reached the finish first";
  if (!winner) { winner = G.teams.slice().sort((a, b) => progress(b) - progress(a) || rng() - 0.5)[0]; how = "got furthest along (no one finished)"; }
  const payout = t => t === winner ? CFG.prize : 0;
  const net = t => t.money - t.start + payout(t);
  say(`${winner.name} ${how} and wins ${money(CFG.prize)}.`);
  renderStatus();
  const me = G.me;
  const table = role => {
    const rows = G.teams.filter(t => t.role === role).sort((a, b) => net(b) - net(a));
    return `<table class="lb"><thead><tr><th>${role === "brand" ? "Brands" : "Influencers"}</th><th>Payout</th><th>Net $</th><th>Trust</th></tr></thead><tbody>${rows.map((t, i) => `
      <tr class="${t.isPlayer ? "you" : ""}"><td>${i === 0 ? "🏆 " : ""}<span class="dot ${t.role}" style="background:${t.color}"></span>${esc(t.name)}<span class="tag">${t.isPlayer ? "YOU" : t.strat.toUpperCase()}</span></td>
      <td>${payout(t) ? money(payout(t)) : "—"}</td><td>${money(net(t))}</td><td>${t.trust}</td></tr>`).join("")}</tbody></table>`;
  };
  const myRank = 1 + G.teams.filter(t => t.role === me.role && net(t) > net(me)).length;
  const h = me.history;
  const W = 300, H = 120, pad = 22;
  const x = i => pad + (h.length > 1 ? i * (W - pad * 2) / (h.length - 1) : 0);
  const yA = v => H - pad - v / 100 * (H - pad * 2);
  const yT = v => H - pad - v / 10 * (H - pad * 2);
  const line = (fn, key) => h.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${fn(p[key]).toFixed(1)}`).join(" ");
  const chart = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Your attention and trust by round">
    <line x1="${pad}" y1="${H - pad}" x2="${W - pad}" y2="${H - pad}" stroke="var(--line)"/>
    <path d="${line(yA, "att")}" fill="none" stroke="var(--sky)" stroke-width="2.5"/>
    <path d="${line(yT, "trust")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="5 4"/>
    ${h.map((p, i) => `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">R${p.round}</text>`).join("")}
    <text x="${pad}" y="12">attention (0–100)</text><text x="${W - pad}" y="12" text-anchor="end" fill="var(--accent)">trust (0–10, dashed)</text></svg>`;
  const flops = me.flops.length ? me.flops.map(f => `<li>Round ${f.round}, ${esc(f.card)}: trust ${f.trustIn} going in (${BAND_NAME[band(f.trustIn)]}), chose ${esc(f.response)}: +${f.dAtt} attention, ${f.dTrust >= 0 ? "+" : ""}${f.dTrust} trust, ${f.step >= 0 ? "+" : ""}${f.step} spaces.</li>`).join("") : "<li>No flop targeted your team.</li>";
  setPhase(`<div class="phase-head"><h2>Game over</h2><span class="eyebrow">${G.rounds} rounds</span></div>
    <p class="prompt">${esc(winner.isPlayer ? "You" : winner.name)} ${how} and won ${money(CFG.prize)}. You finished <b>#${myRank}</b> of ${G.teams.filter(t => t.role === me.role).length} ${me.role === "brand" ? "brands" : "influencers"}.</p>
    <div class="lb-wrap">${table("brand")}</div><div class="lb-wrap">${table("infl")}</div>
    <div class="story"><div class="eyebrow">Success or lucky accident? · Our flops</div><ul>${flops}</ul></div>
    <div class="story"><div class="eyebrow">Who won the moment?</div>From other teams' events you gained <b class="num">${me.fromOthers.att}</b> attention and <b class="num">${me.fromOthers.spaces}</b> spaces.</div>
    <div class="story"><div class="eyebrow">Attention or lasting value?</div>${chart}<div class="small">Net money ${money(net(me))}.</div></div>
    <div class="row"><button class="btn primary" data-again>Play again</button></div>`);
  waitClick("[data-again]").then(showSetup);
}


const HOW_TO = `
  <div class="howto">
    <section><h3>The big idea</h3><ul>
      <li>Your team races along the candy track to the castle.</li>
      <li><b>Brands</b> are companies. <b>Influencers</b> are creators people follow.</li>
      <li>Each round: everyone rolls and moves, a topic starts trending, you make deals, then a <b>real social media flop</b> happens and you react.</li>
    </ul></section>
    <section><h3>Your four numbers</h3><ul>
      <li><b>Attention</b>: how many eyes are on you. Comes fast, fades a quarter every round.</li>
      <li><b>Trust</b>: whether people believe you. Slow to build, slow to lose.</li>
      <li><b>Money</b>: payday spaces pay attention × trust × $100.</li>
      <li><b>Risk</b>: a wobbly candy stack. If your risk is bigger than your roll, you get a backlash and slide back 3 spaces. Pay to shrink it.</li>
    </ul></section>
    <section><h3>How to win</h3><ul>
      <li>The first team to reach the castle wins <b>$1,000,000</b>. If nobody makes it, the team furthest along wins it.</li>
      <li>Good choices move you forward. Fast reactions earn bonus spaces.</li>
      <li>Leaning in on a flop pays big when your trust is High, and pushes you back when it's Low.</li>
      <li>At the end, teams are ranked by money gained, against their own role.</li>
    </ul></section>
    <section><h3>How to work together</h3><ul>
      <li><b>Deals:</b> a brand pays an influencer to team up for two rounds. The brand borrows the influencer's attention (all of it if their topic is trending). The influencer gets the fee and extra attention.</li>
      <li>Team up with the same partner again and you both gain trust.</li>
      <li><b>Support</b> a team in trouble: safe attention and 1 space. <b>Critique</b>: more attention and 2 spaces, but it adds risk and backfires if they lean in with High trust.</li>
      <li>Tap <b>Learn more</b> to read the true story. It hints at the smart move, but the clock keeps running.</li>
    </ul></section>
  </div>`;
function showRules() {
  const root = $("overlayRoot");
  root.innerHTML = `<div class="overlay"><div class="modal wide stack" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
    <h2 id="rulesTitle">How to play</h2>${HOW_TO}<div class="row"><button class="btn primary" data-close type="button">Back to the game</button></div></div></div>`;
  root.querySelector("[data-close]").addEventListener("click", () => { root.innerHTML = ""; });
}
/* ============================================================ setup */
function showSetup() {
  const root = $("overlayRoot");
  let profile = "Heritage", tag = "Food";
  const draw = () => {
    const role = PROFILES[profile].role;
    root.innerHTML = `<div class="overlay"><div class="modal wide stack" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
      <div><div class="eyebrow">Solo test mode · you and five bots</div><h2 id="setupTitle">Viral Path</h2>
      <p class="muted">A racing game about real social media flops. Here's everything you need to know.</p></div>
      ${HOW_TO}
      <div class="field"><label for="teamName">Team name</label><input id="teamName" value="${G && G.me ? esc(G.me.name) : "You"}" maxlength="20"></div>
      <div class="field"><label>Pick a profile</label><div class="picker">${Object.entries(PROFILES).map(([k, p]) => `
        <button class="pick" data-profile="${k}" aria-pressed="${k === profile}"><b>${k} ${p.role === "brand" ? "brand" : "influencer"}</b>
        <small>${p.blurb}</small><small class="num">${money(p.money)} · att ${p.att} · trust ${p.trust}</small></button>`).join("")}</div></div>
      ${role === "infl" ? `<div class="field"><label for="tag">Your trend tag</label><select id="tag">${TAGS.map(t => `<option ${t === tag ? "selected" : ""}>${t}</option>`).join("")}</select></div>` : ""}
      <label class="row small"><input type="checkbox" id="timed" checked> Timed reactions (${CFG.reactionSeconds}s). Faster reactions earn bonus spaces.</label>
      <div class="row"><button class="btn primary" data-start>Start the race</button></div>
      <p class="small muted">Bots play fixed styles shown on the leaderboard: Bold, Cautious, Smart and Random. Balance values come from the simulation in sim/RESULTS.md.</p>
    </div></div>`;
  };
  draw();
  const onClick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.profile) { profile = b.dataset.profile; draw(); }
    if (b.hasAttribute("data-start")) {
      const name = ($("teamName").value || "You").trim().slice(0, 20);
      const timed = $("timed").checked;
      if ($("tag")) tag = $("tag").value;
      root.removeEventListener("click", onClick);
      root.innerHTML = "";
      newGame({ name, profile, tag, timed });
      playGame();
    }
  };
  root.addEventListener("change", e => { if (e.target.id === "tag") tag = e.target.value; });
  root.addEventListener("click", onClick);
}

drawBoard();
$("rulesBtn").addEventListener("click", showRules);
showSetup();
</script>
